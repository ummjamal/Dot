plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv("ALSHUIBI_KEYSTORE")
def releaseStorePassword = System.getenv("ALSHUIBI_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("ALSHUIBI_KEY_ALIAS") ?: "alshuibi"
def releaseKeyPassword = System.getenv("ALSHUIBI_KEY_PASSWORD")

android {
    namespace 'com.alshuibi.grocery'
    compileSdk 36

    defaultConfig {
        applicationId "com.alshuibi.grocery"

        minSdk 24
        targetSdk 36

        versionCode 13
        versionName "4.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseStoreFile != null &&
                    releaseStorePassword != null &&
                    releaseKeyPassword != null) {

                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release

            // نبقي التصغير مغلقاً في 4.0.1 حتى لا ندخل
            // أي أخطاء جديدة قبل النشر.
            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.airbnb.android:lottie:6.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}